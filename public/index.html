<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor de Gastos</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><h1>Gestor de Gastos</h1></header>
  <main>
    <section class="card">
      <h2>Presupuesto</h2>
      <form id="budget-form" class="row">
        <input id="budget" type="number" step="0.01" min="0" placeholder="Presupuesto total" required>
        <button type="submit">Guardar presupuesto</button>
      </form>
      <div class="stats">
        <div class="stat"><span>Presupuesto</span><strong id="stat-budget">0.00</strong></div>
        <div class="stat"><span>Total gastado</span><strong id="stat-spent">0.00</strong></div>
        <div class="stat"><span>Restante</span><strong id="stat-remaining">0.00</strong></div>
      </div>
    </section>

    <section class="card">
      <h2 id="form-title">Nuevo gasto</h2>
      <form id="expense-form">
        <input id="description" placeholder="Descripción" required>
        <input id="amount" type="number" step="0.01" min="0.01" placeholder="Monto" required>
        <select id="category"></select>
        <button type="submit" id="submit-btn">Agregar</button>
        <button type="button" id="cancel-btn" class="secondary" hidden>Cancelar</button>
      </form>
      <p id="error" class="error"></p>
    </section>

    <section class="card">
      <h2>Gastos</h2>
      <div class="row">
        <label for="filter">Filtrar por categoría:</label>
        <select id="filter"><option value="">Todas</option></select>
      </div>
      <table>
        <thead>
          <tr><th>Fecha</th><th>Descripción</th><th>Categoría</th><th>Monto</th>
          <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
      <p id="empty" class="empty" hidden>No hay gastos registrados.</p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
